[project]
name = "negahban"
version = "0.1.0"
description = "Instagram comment moderator on the official Instagram API: classifies comments with Claude and hides abuse and spam."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
negahban = "negahban.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negahban"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on default-argument call sites that ANN/B008 dislike.
"src/negahban/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Keep the type checker strict.
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"
